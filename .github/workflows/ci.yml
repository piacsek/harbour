name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: shard (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            tests: --test app
          - name: rest
            tests: -E 'not binary(app)'
            rest: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.name }}
      - if: matrix.rest
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux
      - env:
          NVIM_VERSION: v0.12.6
          NVIM_SHA256: 474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nvim.tar.gz" "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
          echo "$NVIM_SHA256  $RUNNER_TEMP/nvim.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --version | head -n 1)" = "NVIM $NVIM_VERSION"
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-nextest@0.9.144
          fallback: none
      - if: matrix.rest
        run: cargo fmt --check
      - if: matrix.rest
        run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo nextest run --locked --config-file .github/nextest.toml --run-ignored all ${{ matrix.tests }}
      - if: matrix.rest
        run: cargo test --doc --locked
      - if: ${{ !cancelled() }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          files: target/nextest/default/junit.xml
          disable_search: true
          flags: ${{ matrix.name }}
          token: ${{ secrets.CODECOV_TOKEN }}
      - if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.name }}
          path: target/nextest/default/junit.xml
          retention-days: 1
    timeout-minutes: 10

  test-speed:
    needs: shard
    if: ${{ github.event_name == 'push' && needs.shard.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-*
          path: junit
      - run: mkdir site && python3 scripts/test-speed.py junit/*/junit.xml > site/test-speed.svg
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
    timeout-minutes: 5

  test-speed-deploy:
    needs: test-speed
    if: ${{ needs.test-speed.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}test-speed.svg
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
    timeout-minutes: 5

  check:
    needs: shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          SHARDS: ${{ needs.shard.result }}
        run: test "$SHARDS" = success
    timeout-minutes: 5

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-audit
          fallback: none # never fall back to cargo-binstall / a source build
      - run: cargo-audit audit
    timeout-minutes: 5

  paths:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
      - id: decide
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: scripts/flake-build-needed.sh "$BASE" | tee -a "$GITHUB_OUTPUT"
    timeout-minutes: 5

  flake:
    needs: paths
    if: ${{ !cancelled() && needs.paths.outputs.build != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix build
      - run: test "$(./result/bin/harbour --version)" = "harbour $(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
    timeout-minutes: 20

  flake-ok:
    needs: [paths, flake]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - env:
          PATHS: ${{ needs.paths.result }}
          BUILD: ${{ needs.paths.outputs.build }}
          FLAKE: ${{ needs.flake.result }}
        run: scripts/flake-ok.sh "$PATHS" "$BUILD" "$FLAKE"
    timeout-minutes: 5
