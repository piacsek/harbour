[package]
name = "harbour"
version = "0.13.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Harbour: where shipping begins"
repository = "https://github.com/piacsek/harbour"

[dev-dependencies]
toml = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
crossterm = "0.29.0"
nix = { version = "=0.28.0", default-features = false, features = ["poll", "signal", "socket", "user"] }
portable-pty = "0.9.0"
ratatui = "0.30.2"
rmpv = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3"
tui-term = "0.3.4"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
vt100 = "0.16.2"
