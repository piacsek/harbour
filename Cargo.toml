[package]
name = "harbour"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Harbour: where shipping begins"
repository = "https://github.com/piacsek/harbour"

[dev-dependencies]
tempfile = "3"
toml = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
